name: Deploy tower ledger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish static files
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          ledger_tree=$(git rev-parse HEAD:dist)
          ledger_commit=$(printf '%s\n' "Deploy ${GITHUB_SHA}" | git commit-tree "${ledger_tree}")
          git push origin "${ledger_commit}:refs/heads/gh-pages" --force
